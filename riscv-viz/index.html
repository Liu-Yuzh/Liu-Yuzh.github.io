<html lang="ja">
<head>

<title>パイプライン信号ビューア</title>

<style>
:root {
  --bg: #f7f8f9; --panel: #ffffff; --ink: #1d2733; --muted: #66727f; --line: #c7d0d8;
  --blk: #eef2f5; --blk-on: #dff3ef; --edge-on: #0f766e; --wire: #b3bec8; --wire-on: #0f766e;
  --one: #0f766e; --one-ink: #ffffff; --chg: #b45309; --flush: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12171c; --panel: #1a2128; --ink: #e3e9ee; --muted: #93a1ad; --line: #34404b;
    --blk: #222b33; --blk-on: #183a36; --edge-on: #2dd4bf; --wire: #44525e; --wire-on: #2dd4bf;
    --one: #2dd4bf; --one-ink: #0b1b19; --chg: #f59e0b; --flush: #f87171;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 14px; }
header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
.meta { color: var(--muted); font-size: 12px; }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button, select, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; min-width: 34px; }
button:hover { border-color: var(--edge-on); }
input[type=range] { width: 220px; padding: 0; }
input.num { width: 84px; }
main { padding: 12px 16px 32px; max-width: 1400px; margin: 0 auto; }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stage .k { font-size: 12px; color: var(--muted); }
.stage .v { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.stage.empty .v { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.card h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
svg { width: 100%; height: auto; display: block; }
svg text { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; fill: var(--ink); }
svg .mono { font-family: ui-monospace, Menlo, monospace; }
.blk rect.box { fill: var(--blk); stroke: var(--line); stroke-width: 1; }
.blk.on rect.box { fill: var(--blk-on); stroke: var(--edge-on); stroke-width: 2; }
.blk.sel rect.box { stroke: var(--chg); stroke-width: 2.5; }
.blk { cursor: pointer; }
.blk .title { font-size: 13px; font-weight: 600; }
.blk .lab { font-size: 11px; fill: var(--muted); }
.blk .val { font-size: 11.5px; }
.blk .val.chg { fill: var(--chg); font-weight: 700; }
.pill { fill: var(--blk); stroke: var(--line); }
.pill.one { fill: var(--one); stroke: var(--one); }
.pilltxt { font-size: 10.5px; }
.pilltxt.one { fill: var(--one-ink); font-weight: 700; }
.bar rect { fill: var(--blk); stroke: var(--line); }
.bar.on rect { fill: var(--blk-on); stroke: var(--edge-on); stroke-width: 2; }
.bar text { font-size: 12px; font-weight: 600; }
.wire polyline { fill: none; stroke: var(--wire); stroke-width: 2; }
.wire.on polyline { stroke: var(--wire-on); stroke-width: 3; }
.wire text { font-size: 11px; fill: var(--muted); }
.wire.on text { fill: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .cols, .stages { grid-template-columns: minmax(0, 1fr); } }
.regs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-family: ui-monospace, Menlo, monospace;
  font-size: 12px; }
.regs div { padding: 3px 6px; border-radius: 4px; background: var(--bg); white-space: nowrap; overflow: hidden; }
.regs div.chg { outline: 2px solid var(--chg); }
.regs span { color: var(--muted); display: inline-block; width: 4.2em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 6px; background: var(--bg); }
.chip.one { background: var(--one); color: var(--one-ink); border-color: var(--one); }
.chip.chg { outline: 2px solid var(--chg); }
table.det { border-collapse: collapse; width: 100%; font-size: 12px; }
table.det td { border-bottom: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
table.det td.p { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-all; }
table.det td.b { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
</style>
</head>

<header>
  <h1>パイプライン信号ビューア</h1>

      <option value="80">速い</option></select>
    <input id="slider" type="range" min="0" max="0" value="0">
    <label>サイクル <input id="cyc" class="num" type="number"></label>
    <label>PC <input id="pc" class="num" placeholder="80" title="ID にこの番地の命令が来る次のサイクルへ"></label>
  </div>
  <div class="meta" id="meta"></div>
</header>
<main>

  </div>
  <div id="panels"></div>
</main>

","14":"FLT","15":"FLE","16":"CLASS","17":"CVT_S_W","18":"CVT_S_WU","19":"MV_W_X","20":"MADD","21":"MSUB","22":"NMSUB","23":"NMADD"},"cvalu":{"24":"ALU_ADD","25":"ALU_SUB","26":"ALU_ADDU","27":"ALU_SUBU","28":"ALU_ADDR","29":"ALU_SUBR","30":"ALU_ADDUR","31":"ALU_SUBUR","47":"ALU_XOR","46":"ALU_OR","21":"ALU_AND","36":"ALU_SRA","37":"ALU_SRL","38":"ALU_ROR","39":"ALU_SLL","40":"ALU_BEXT","41":"ALU_BEXTU","42":"ALU_BINS","43":"ALU_BCLR","44":"ALU_BSET","73":"ALU_BREV","54":"ALU_FF1","55":"ALU_FL1","52":"ALU_CNT","53":"ALU_CLB","62":"ALU_EXTS","63":"ALU_EXT","0":"ALU_LTS","1":"ALU_LTU","4":"ALU_LES","5":"ALU_LEU","8":"ALU_GTS","9":"ALU_GTU","10":"ALU_GES","11":"ALU_GEU","12":"ALU_EQ","13":"ALU_NE","2":"ALU_SLTS","3":"ALU_SLTU","6":"ALU_SLETS","7":"ALU_SLETU","20":"ALU_ABS","22":"ALU_CLIP","23":"ALU_CLIPU","45":"ALU_INS","16":"ALU_MIN","17":"ALU_MINU","18":"ALU_MAX","19":"ALU_MAXU","48":"ALU_DIVU","49":"bit 1 is used for remdiv\n    ALU_DIV","50":"bit 1 is used for remdiv\n    ALU_REMU","51":"bit 1 is used for remdiv\n    ALU_REM","58":"bit 1 is used for remdiv\n\n    ALU_SHUF","59":"ALU_SHUF2","56":"ALU_PCKLO","57":"ALU_PCKHI"},"cvmul":{"0":"MUL_MAC32","1":"MUL_MSU32","2":"MUL_I","3":"MUL_IR","4":"MUL_DOT8","5":"MUL_DOT16","6":"MUL_H"},"cvctrl":{"0":"RESET","1":"BOOT_SET","2":"SLEEP","3":"WAIT_SLEEP","4":"FIRST_FETCH","5":"DECODE","6":"IRQ_FLUSH_ELW","7":"ELW_EXE","8":"FLUSH_EX","9":"FLUSH_WB","10":"XRET_JUMP","11":"DBG_TAKEN_ID","12":"DBG_TAKEN_IF","13":"DBG_FLUSH","14":"DBG_WAIT_BRANCH","15":"DECODE_HWLOOP"},"cvpcmux":{"0":"BOOT","2":"JUMP","3":"BRANCH","4":"EXCEPTION","1":"FENCEI","5":"MRET","6":"URET","7":"DRET","8":"HWLOOP"}}};
const ABI = ['zero','ra','sp','gp','tp','t0','t1','t2','s0','s1','a0','a1','a2','a3','a4','a5','a6','a7',
  's2','s3','s4','s5','s6','s7','s8','s9','s10','s11','t3','t4','t5','t6'];
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
let core = null, n = 0, t = 0, timer = null, sel = null;

function expand(ch, len) {          // [[添字, 値], ...] -> 長さ len の配列
  const out = new Array(len);
  for (let k = 0; k < ch.length; k++) {
    const end = k + 1 < ch.length ? ch[k + 1][0] : len;
    for (let i = ch[k][0]; i < end; i++) out[i] = ch[k][1];
  }
  return out;
}
function load(idx) {
  core = DATA.cores[idx];
  n = core.cycles[1];
  if (!core.full) {
    core.full = {}; core.stg = {};
    for (const k in core.vals) core.full[k] = expand(core.vals[k], n);
    for (const k in core.stages) core.stg[k] = expand(core.stages[k], n);
  }
  $('slider').max = Math.max(0, n - 1);
  t = Math.min(t, n - 1);
  sel = sel || 'dec';
  draw(); show();
}
const raw = (p, i = t) => (core.full[p] ? core.full[p][i] : undefined);
const num = (p, i = t) => { const v = raw(p, i); return v == null ? 0 : parseInt(v, 16); };
const on = (list) => list.some((p) => { const v = raw(p); return v != null && v !== '0'; });
function fmt(p, i = t) {
  const v = raw(p, i);
  if (v === undefined) return '—';
  if (v === null) return 'x';
  const w = core.width[p] || 32;
  const e = core.enum_of[p];
  if (e && DATA.enums[e]) {
    const name = DATA.enums[e][parseInt(v, 16)];
    return name !== undefined ? name : '0x' + v;
  }
  if (w === 1) return v;
  if (w <= 6) return String(parseInt(v, 16));
  return '0x' + v.padStart(Math.ceil(w / 4), '0');
}
const changed = (p) => t > 0 && raw(p) !== raw(p, t - 1);
function bin(p) {
  const v = raw(p); if (v == null) return '';
  const w = core.width[p] || 32;
  if (w > 64) return '';
  let s = BigInt('0x' + v).toString(2).padStart(w, '0');
  return s.replace(/(.{4})(?=.)/g, '$1 ');
}
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

// ------------------------------------------------------------------- 図 ---
let refs = null;
function draw() {
  const svg = $('dia'); svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  for (const [id, cls] of [['arr', 'var(--wire)'], ['arron', 'var(--wire-on)']]) {
    const m = el('marker', {id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto'}, defs);
    el('path', {d: 'M0,0 L10,5 L0,10 z', style: 'fill:' + cls}, m);
  }
  refs = {wires: [], blocks: [], bars: []};
  for (const w of core.wires) {
    const g = el('g', {class: 'wire'}, svg);
    const line = el('polyline', {points: w.pts.map((p) => p.join(',')).join(' '), 'marker-end': 'url(#arr)'}, g);
    let tx = null;
    if (w.label || w.sig) {
      const [a, b] = longest(w.pts);
      tx = el('text', {x: (a[0] + b[0]) / 2 + (a[0] === b[0] ? 6 : 0), y: (a[1] + b[1]) / 2 - 5,
        'text-anchor': a[0] === b[0] ? 'start' : 'middle'}, g);
    }
    refs.wires.push({w, g, line, tx});
  }
  for (const b of core.bars) {
    const g = el('g', {class: 'bar'}, svg);
    el('rect', {x: b.x, y: 60, width: 24, height: 470, rx: 4}, g);
    el('text', {x: b.x + 12, y: 295, 'text-anchor': 'middle', transform: `rotate(-90 ${b.x + 12} 295)`}, g, b.title);
    refs.bars.push({b, g});
  }
  for (const b of core.blocks) {
    const g = el('g', {class: 'blk', tabindex: 0}, svg);
    g.addEventListener('click', () => { sel = b.id; show(); });
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { sel = b.id; show(); } });
    el('rect', {class: 'box', x: b.x, y: b.y, width: b.w, height: b.h, rx: 6}, g);
    el('text', {class: 'title', x: b.x + 10, y: b.y + 18}, g, b.title);
    const rows = [];
    const rh = (b.h - 26) / Math.max(1, b.rows.length);
    b.rows.forEach(([lab, p], i) => {
      const y = b.y + 26 + rh * i + rh / 2 + 4;
      el('text', {class: 'lab', x: b.x + 10, y}, g, lab);
      const w1 = (core.width[p] || 32) === 1 && !core.enum_of[p];
      let pill = null, val;
      if (w1) {
        pill = el('rect', {class: 'pill', x: b.x + b.w - 34, y: y - 11, width: 24, height: 15, rx: 7}, g);
        val = el('text', {class: 'pilltxt mono', x: b.x + b.w - 22, y: y, 'text-anchor': 'middle'}, g);
      } else {
        val = el('text', {class: 'val mono', x: b.x + b.w - 10, y, 'text-anchor': 'end'}, g);
      }
      rows.push({p, pill, val});
    });
    refs.blocks.push({b, g, rows});
  }
}
function longest(pts) {
  let best = [pts[0], pts[1]], len = -1;
  for (let i = 0; i + 1 < pts.length; i++) {
    const l = Math.abs(pts[i + 1][0] - pts[i][0]) + Math.abs(pts[i + 1][1] - pts[i][1]);
    if (l > len) { len = l; best = [pts[i], pts[i + 1]]; }
  }
  return best;
}

// --------------------------------------------------------------- 表示 ---
function show() {
  $('slider').value = t;
  $('cyc').value = core.cycles[0] + t;
  $('meta').textContent = `${DATA.name} (${DATA.elf})  ${core.title}  サイクル ${core.cycles[0]}〜${core.cycles[0] + n - 1}`;
  // 段ごとの命令
  const st = $('stages'); st.innerHTML = '';
  for (const k of ['IF', 'ID', 'EX', 'WB']) {
    const pc = core.stg[k] ? core.stg[k][t] : null;
    const d = document.createElement('div');
    d.className = 'stage' + (pc == null ? ' empty' : '');
    const dis = pc == null ? '' : (DATA.disasm[pc] || '?');
    d.innerHTML = `<div class="k">${k === 'WB' ? 'WB (ロードの応答待ち)' : k}</div><div class="v"></div>`;
    d.querySelector('.v').textContent = pc == null ? '(なし)' : `${pc.padStart(8, '0')}  ${dis}`;
    d.querySelector('.v').title = d.querySelector('.v').textContent;
    st.appendChild(d);
  }
  // 図
  for (const r of refs.wires) {
    const a = on(r.w.active);
    r.g.classList.toggle('on', a);
    r.line.setAttribute('marker-end', a ? 'url(#arron)' : 'url(#arr)');
    if (r.tx) r.tx.textContent = [r.w.label, r.w.sig ? fmt(r.w.sig) : ''].filter(Boolean).join(' ');
  }
  for (const r of refs.bars) r.g.classList.toggle('on', on(r.b.active));
  for (const r of refs.blocks) {
    r.g.classList.toggle('on', on(r.b.active));
    r.g.classList.toggle('sel', r.b.id === sel);
    for (const x of r.rows) {
      const s = fmt(x.p);
      x.val.textContent = s;
      if (x.pill) {
        const one = s === '1';
        x.pill.classList.toggle('one', one);
        x.val.classList.toggle('one', one);
      } else {
        x.val.classList.toggle('chg', changed(x.p));
      }
    }
  }
  // ブロックの詳しい値
  const b = core.blocks.find((x) => x.id === sel) || core.blocks[0];
  $('dettitle').textContent = 'ブロックの信号: ' + b.title;
  let h = '<table class="det">';
  for (const [lab, p] of b.rows) {
    h += `<tr><td>${lab}</td><td class="b">${esc(fmt(p))}${bin(p) && (core.width[p] || 32) > 1 ? '<br>' + bin(p) : ''}</td>` +
         `<td class="p">${esc(p)}</td></tr>`;
  }
  $('det').innerHTML = h + '</table>';
  // レジスタ
  const rg = $('regs'); rg.innerHTML = '';
  core.regs.forEach((p, i) => {
    const d = document.createElement('div');
    const name = i < 32 ? `x${i}/${ABI[i]}` : `f${i - 32}`;
    d.innerHTML = `<span>${name}</span>${esc(fmt(p))}`;
    if (changed(p)) d.className = 'chg';
    rg.appendChild(d);
  });
  // 表
  const pn = $('panels'); pn.innerHTML = '';
  for (const pl of core.panels) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<h2>${esc(pl.title)}</h2><div class="chips"></div>`;
    const ch = c.querySelector('.chips');
    const pre = commonPrefix(pl.paths);
    for (const p of pl.paths) {
      const s = fmt(p);
      const d = document.createElement('span');
      d.className = 'chip' + ((core.width[p] || 32) === 1 && s === '1' ? ' one' : '') + (changed(p) ? ' chg' : '');
      d.textContent = `${p.slice(pre.length)} ${s}`;
      d.title = p;
      ch.appendChild(d);
    }
    pn.appendChild(c);
  }
}
function commonPrefix(a) {
  if (!a.length) return '';
  let p = a[0].slice(0, a[0].lastIndexOf('.') + 1);
  for (const s of a) while (!s.startsWith(p)) p = p.slice(0, p.slice(0, -1).lastIndexOf('.') + 1);
  return p;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// ------------------------------------------------------------- 操作 ---
function go(i) { t = Math.max(0, Math.min(n - 1, i)); show(); }
function play() {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶︎'; return; }
  $('play').textContent = '❚❚';
  timer = setInterval(() => { if (t >= n - 1) play(); else go(t + 1); }, +$('speed').value);
}
$('first').onclick = () => go(0);
$('prev').onclick = () => go(t - 1);
$('next').onclick = () => go(t + 1);
$('last').onclick = () => go(n - 1);
$('play').onclick = play;
$('speed').onchange = () => { if (timer) { play(); play(); } };
$('slider').oninput = (e) => go(+e.target.value);
$('cyc').onchange = (e) => go(+e.target.value - core.cycles[0]);
$('pc').onchange = (e) => {
  const want = e.target.value.trim().toLowerCase().replace(/^0x/, '').replace(/^0+/, '') || '0';
  const id = core.stg.ID;
  for (let k = 1; k <= n; k++) {
    const i = (t + k) % n;
    if (id[i] === want && id[(i - 1 + n) % n] !== want) { go(i); return; }
  }
  e.target.setCustomValidity('ID にこの番地の命令が来るサイクルがない'); e.target.reportValidity();
  setTimeout(() => e.target.setCustomValidity(''), 1500);
};
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(t + 1);
  else if (e.key === 'ArrowLeft') go(t - 1);
  else if (e.key === ' ') { e.preventDefault(); play(); }
});
DATA.cores.forEach((c, i) => {
  const o = document.createElement('option'); o.value = i; o.textContent = c.title; $('core').appendChild(o);
});
$('core').onchange = (e) => load(+e.target.value);
load(0);
</script>
