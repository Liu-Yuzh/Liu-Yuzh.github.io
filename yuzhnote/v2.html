<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e24">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>YuzhNote 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* 左にメモ一覧、右にエディタ。1行目がタイトル（Cosense と同じ） */
:root {
  --bg: #1e1e24; --side: #18181d; --panel: #26262e; --ink: #dcdde3; --muted: #8a8c99; --line: #33343f;
  --accent: #a68bfa; --link: #b9a5ff; --code: #2c2c36;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #ffffff; --side: #f6f6f8; --panel: #ececf1; --ink: #222229; --muted: #6c6e7a; --line: #e0e0e6;
          --accent: #7048e8; --link: #6741d9; --code: #f1f1f5; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
body { display: grid; grid-template-columns: 260px 1fr; height: 100dvh; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* サイドバー */
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
        padding-top: env(safe-area-inset-top); }
.side-head { display: flex; gap: 6px; padding: 12px; align-items: center; }
.side-head h1 { font-size: 14px; margin: 0; flex: 1; }
.side-head a { font-size: 12px; color: var(--muted); }
.icon { background: none; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--muted); font-size: 15px; }
.icon:hover { background: var(--panel); color: var(--ink); }
#search { margin: 0 12px 8px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
          color: var(--ink); font: inherit; font-size: 14px; }
#list, #v1list { list-style: none; margin: 0; padding: 0 6px 12px; overflow-y: auto; flex: 1; }
#v1 { border-top: 1px solid var(--line); padding: 8px 0 0; max-height: 40%; overflow-y: auto; }
#v1 summary { padding: 4px 16px 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
#list button, #v1list button { width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 10px;
               font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list button:hover, #v1list button:hover { background: var(--panel); color: var(--ink); }
#list button[aria-current="true"] { background: var(--panel); color: var(--ink); font-weight: 700; }

/* エディタ */
section { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding-top: env(safe-area-inset-top); }
.top { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.top .crumb { flex: 1; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toggle-side { display: none; }
.pane { flex: 1; overflow-y: auto; min-height: 0; }
.doc { max-width: 760px; margin: 0 auto; padding: 28px 28px 80px; }
#editor { display: block; width: 100%; min-height: 70vh; border: 0; resize: none; background: none; color: var(--ink);
          font: 16px/1.75 var(--font-body); outline: none; field-sizing: content; }
#view { font-size: 16px; line-height: 1.75; word-break: break-word; }
#view .title { font-size: 26px; font-weight: 700; margin: 0 0 16px; }
#view .line { min-height: 1.75em; }
#view .bullet::before { content: "•"; color: var(--muted); display: inline-block; width: 1.2em; margin-left: -1.2em; }
#view h2 { font-size: 21px; margin: 18px 0 4px; } #view h3 { font-size: 18px; margin: 14px 0 4px; } #view h4 { font-size: 16px; margin: 10px 0 2px; }
#view a { color: var(--link); text-decoration: none; } #view a:hover { text-decoration: underline; }
#view a.new { opacity: .65; }
#view a.ext::after { content: " ↗"; font-size: 11px; }
#view code, #view pre { font-family: var(--font-mono); font-size: 13.5px; background: var(--code); border-radius: 4px; }
#view code { padding: 1px 5px; }
#view pre { padding: 10px 12px; margin: 4px 0; white-space: pre-wrap; }
#view pre .cap { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
#view img { max-width: 100%; max-height: 360px; border-radius: 6px; display: block; }
#view span.icon { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin: 0 1px; }
#view img.icon { display: inline-block; height: 1.3em; width: auto; border-radius: 3px; vertical-align: -0.25em; margin: 0 1px; }
#view .table { margin: 4px 0; overflow-x: auto; }
#view .table .cap { display: block; color: var(--muted); font-size: 11.5px; }
#view table { border-collapse: collapse; font-size: 14.5px; }
#view td { border: 1px solid var(--line); padding: 4px 10px; }
#view tr:first-child td { background: var(--code); font-weight: 700; }
.backlinks { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; }
.backlinks h2 { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.backlinks button { display: block; background: none; border: 0; padding: 3px 0; color: var(--link); text-align: left; }
.hidden { display: none !important; }

/* [ を打ったときの候補 */
#suggest { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           box-shadow: 0 8px 24px #0006; list-style: none; margin: 0; padding: 4px; max-height: 240px; overflow-y: auto; min-width: 220px; }
#suggest li { padding: 6px 10px; border-radius: 5px; font-size: 14px; cursor: pointer; }
#suggest li[aria-selected="true"] { background: var(--accent); color: #fff; }
#suggest li small { color: var(--muted); margin-left: 6px; }
#suggest li[aria-selected="true"] small { color: #fffc; }

.bottom { display: flex; gap: 8px; align-items: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
          border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.bottom .grow { flex: 1; }
.btn { font-size: 13px; border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }

/* スマホ：サイドバーは引き出し */
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 25% 0 0; z-index: 5; box-shadow: 4px 0 24px #0008; transform: translateX(-105%); transition: transform .2s; }
  body.side-open aside { transform: none; }
  #toggle-side { display: inline-block; }
  .doc { padding: 18px 16px 80px; }
}
</style>
</head>
<body>
<aside>
  <div class="side-head">
    <h1>YuzhNote 2.0</h1>
    <a href="./">1.0 へ</a>
    <button class="icon" type="button" id="new" title="新しいメモ" aria-label="新しいメモ">＋</button>
  </div>
  <input id="search" type="search" placeholder="メモを検索" aria-label="メモを検索">
  <ul id="list"></ul>
  <details id="v1" class="hidden">
    <summary>1.0 の下書き</summary>
    <ul id="v1list"></ul>
  </details>
</aside>

<section>
  <div class="top">
    <button class="icon" type="button" id="toggle-side" aria-label="メモ一覧">☰</button>
    <span class="crumb" id="crumb"></span>
    <button class="icon" type="button" id="mode" title="編集／閲覧の切り替え (Ctrl+E)">閲覧</button>
  </div>
  <div class="pane" id="pane">
    <div class="doc">
      <textarea id="editor" spellcheck="false" aria-label="本文（1行目がタイトル）" placeholder="1行目がタイトルです&#10;&#10;[ でページへのリンク、#タグ、[** 見出し]、行頭スペースで箇条書き"></textarea>
      <div id="view" class="hidden"></div>
      <div class="backlinks hidden" id="backlinks"><h2>このメモへのリンク</h2><div id="backlist"></div></div>
    </div>
  </div>
  <div class="bottom">
    <span class="grow" id="info"></span>
    <button class="btn" type="button" id="del">削除</button>
    <button class="btn" type="button" id="copy">本文コピー</button>
    <a class="btn primary" id="send" href="#" target="_blank" rel="noopener">Cosenseで開く</a>
  </div>
</section>
<ul id="suggest" class="hidden" role="listbox"></ul>

<script>
const PROJECT = 'YuzhNote';
const KEY = 'yuzhnote-v2-notes';
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = s => s.trim().toLowerCase().replace(/[\s_]+/g, ' ');
const titleOf = n => n.text.split('\n')[0].trim();

/* ===== メモの保存（この端末の localStorage） ===== */
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let notes = store.get(KEY)?.list || [];
let cur = null;
let mode = 'edit';
const save = () => store.set(KEY, { current: cur?.id, list: notes });
const findByTitle = t => notes.find(n => norm(titleOf(n)) === norm(t));

function create(text = '') {
  const n = { id: newId(), text, updated: Date.now() };
  notes.push(n);
  return n;
}
function open(n, m = mode) {
  // 何も書いていないメモは、離れたら消す
  if (cur && cur !== n && !cur.text.trim()) notes = notes.filter(x => x !== cur);
  cur = n; save();
  $('editor').value = n.text;
  document.body.classList.remove('side-open');
  setMode(m); renderList(); refresh();
}

/* ===== 1.0 の下書きを読む ===== */
// 開くと 2.0 のメモに写す（from に元の id を残し、二重に写さない）。1.0 側の下書きはそのまま
const V1_TAG = { book: '#読書メモ', know: '#知識メモ', comp: '#コンピュータ' };
const v1Tag = t => /[\[\]#]/.test(t) ? `[${t}]` : '#' + t.replace(/\s+/g, '_');
function v1Text(d) {
  const tags = [d.cat === 'art' ? `#文化創作 #${d.sub}` : V1_TAG[d.cat] || '',
    ...(d.cat === 'book' && d.status ? ['#' + d.status] : []), ...(d.tags || []).map(v1Tag)].filter(Boolean);
  const body = d.body === d.lastTemplate ? '' : (d.body || '').replace(/\s+$/, '');
  return [d.title || '', tags.join(' '), ...(d.urls || []).map(u => u.trim()).filter(Boolean), ...(body ? [body] : [])].join('\n');
}
// v1Text の逆：1行目がタイトル、2行目がタグ行、続く URL だけの行がリンク、残りが本文
const V1_CAT = { '読書メモ': 'book', '知識メモ': 'know', 'コンピュータ': 'comp', '文化創作': 'art' };
const V1_STATUS = ['積読', '読書中', '読了'];
function v1Parse(text, d) {
  const lines = text.split('\n');
  const out = { title: lines[0].trim(), cat: d.cat, sub: d.sub, status: '', tags: [], urls: [] };
  let i = 1;
  // [..] のタグは中に [ ] を含むことがある（1.0 の fmtTag）ので、次の " #" か " [" か行末までを1つとみる
  const toks = (lines[1] || '').trim().match(/#\S+|\[.*?\](?=\s+[#\[]|$)/g);
  if (toks && toks.join(' ') === lines[1].trim()) {
    i = 2;
    let art = false;
    // # のタグは 1.0 で空白を _ にしているので戻す
    for (const t of toks.map(t => t.startsWith('#') ? t.slice(1).replace(/_/g, ' ') : t.slice(1, -1))) {
      if (V1_CAT[t]) { out.cat = V1_CAT[t]; art = t === '文化創作'; }
      else if (art) { out.sub = t; art = false; }
      else if (out.cat === 'book' && V1_STATUS.includes(t)) out.status = t;
      else out.tags.push(t);
    }
  }
  while (i < lines.length && /^https?:\/\/\S+$/.test(lines[i].trim())) out.urls.push(lines[i++].trim());
  if (!out.urls.length) out.urls = [''];
  out.body = lines.slice(i).join('\n');
  return out;
}
// 1.0 の下書きから写したメモ：2.0 で書いたら 1.0 へ書き戻し、1.0 のほうが新しければ 2.0 へ取り込む
function syncToV1(n) {
  if (!n.from) return;
  const saved = store.get('yuzhnote-drafts');
  const d = saved?.list?.find(x => x.id === n.from);
  if (!d) return; // 1.0 側で消された
  Object.assign(d, v1Parse(n.text, d), { updated: n.updated });
  store.set('yuzhnote-drafts', saved);
}
function syncFromV1() {
  const list = store.get('yuzhnote-drafts')?.list || [];
  let changed = false;
  for (const n of notes) {
    const d = n.from && list.find(x => x.id === n.from);
    if (d && d.updated > n.updated) { n.text = v1Text(d); n.updated = d.updated; changed = true; }
  }
  if (!changed) return;
  save(); renderList();
  if (cur.from) { $('editor').value = cur.text; refresh(); }
}
addEventListener('focus', syncFromV1);
addEventListener('storage', e => { if (e.key === 'yuzhnote-drafts') syncFromV1(); });

function renderV1() {
  const list = (store.get('yuzhnote-drafts')?.list || [])
    .filter(d => !notes.some(n => n.from === d.id) && (d.title?.trim() || d.urls?.some(u => u.trim()) || (d.body?.trim() && d.body !== d.lastTemplate)));
  $('v1').classList.toggle('hidden', !list.length);
  $('v1list').textContent = '';
  for (const d of list.sort((a, b) => b.updated - a.updated)) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button';
    b.textContent = d.title?.trim() || '（無題）';
    b.onclick = () => { const n = create(v1Text(d)); n.from = d.id; n.updated = d.updated || Date.now(); open(n, 'view'); renderV1(); };
    li.append(b); $('v1list').append(li);
  }
}

/* ===== 1.0 の候補辞書（Cosense の既存ページ名）を借りる ===== */
const cosense = new Set((store.get('yuzhnote-dict')?.titles || []).map(([t]) => t));

/* ===== Cosense 記法を表示用 HTML にする（よく使うものだけ） ===== */
const IMG = /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i;
const isUrl = s => /^https?:\/\//.test(s);
function pageLink(t) {
  const local = findByTitle(t);
  const cls = local ? '' : cosense.has(t) ? 'ext' : 'new';
  return `<a href="#" class="${cls}" data-page="${esc(t)}">${esc(t)}</a>`;
}
function urlLink(u, label) {
  if (!label && IMG.test(u)) return `<img src="${esc(u)}" alt="" loading="lazy">`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener" class="ext">${esc(label || u)}</a>`;
}
// [名前.icon] [/別プロジェクト/名前.icon] [名前.icon*3]
function icon(m) {
  const proj = m[1] ? m[1].slice(1, -1) : PROJECT;
  const src = `https://scrapbox.io/api/pages/${encodeURIComponent(proj)}/${encodeURIComponent(m[2])}/icon`;
  const tag = `<span class="icon" data-icon="${src}" title="${esc(m[2])}">${esc(m[2])}</span>`;
  return tag.repeat(Math.min(+(m[3] || 1), 100));
}
function bracket(inner) {
  let m;
  if ((m = inner.match(/^(\/[^\/\s]+\/)?([^\/].*?)\.icon(?:\*(\d+))?$/))) return icon(m);
  if ((m = inner.match(/^\$\s+(.*)$/))) return `<span class="math" data-tex="${esc(m[1])}">${esc(m[1])}</span>`;
  if ((m = inner.match(/^(\*+)\s+(.*)$/))) {
    const lv = m[1].length;
    return lv >= 2 ? { block: `h${Math.max(2, 6 - lv)}`, html: inline(m[2]) } : `<strong>${inline(m[2])}</strong>`;
  }
  if ((m = inner.match(/^\/\s+(.*)$/))) return `<em>${inline(m[1])}</em>`;
  if ((m = inner.match(/^-\s+(.*)$/))) return `<s>${inline(m[1])}</s>`;
  if ((m = inner.match(/^(https?:\/\/\S+)\s+(.+)$/))) return urlLink(m[1], m[2]);
  if ((m = inner.match(/^(.+)\s+(https?:\/\/\S+)$/))) return urlLink(m[2], m[1]);
  if (isUrl(inner)) return urlLink(inner);
  return pageLink(inner);
}
function inline(s) {
  let out = '', heading = null;
  const re = /`([^`]+)`|\[\[([^\]]+)\]\]|\[([^\[\]]+)\]|(?<![^\s　])#(\S+)|(https?:\/\/[^\s\]]+)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    if (m[1] != null) out += `<code>${esc(m[1])}</code>`;
    else if (m[2] != null) out += `<strong>${inline(m[2])}</strong>`;
    else if (m[3] != null) {
      const r = bracket(m[3]);
      if (typeof r === 'object') { heading = r.block; out += r.html; } else out += r;
    }
    else if (m[4] != null) out += pageLink(m[4]).replace('>' + esc(m[4]) + '<', '>#' + esc(m[4]) + '<');
    else out += urlLink(m[5]);
    last = re.lastIndex;
  }
  out += esc(s.slice(last));
  return heading ? `<${heading}>${out}</${heading}>` : out;
}
function render(text) {
  const lines = text.split('\n');
  let html = `<p class="title">${esc(lines[0] || '（無題）')}</p>`;
  for (let i = 1; i < lines.length; i++) {
    const [, sp, rest] = lines[i].match(/^([ \t　]*)(.*)$/);
    const ind = sp.length;
    // code:名前 / table:名前 の下の、より深くインデントされた行はそのブロックの中身
    const blk = rest.match(/^(code|table):(.+)$/);
    if (blk) {
      const body = [];
      while (i + 1 < lines.length && lines[i + 1].trim() && /^[ \t　]*/.exec(lines[i + 1])[0].length > ind) body.push(lines[++i].slice(ind + 1));
      const style = `margin-left:${ind * 1.4}em`;
      if (blk[1] === 'code') html += `<pre style="${style}"><span class="cap">${esc(blk[2])}</span>${esc(body.join('\n'))}</pre>`;
      else html += `<div class="table" style="${style}"><span class="cap">${esc(blk[2])}</span><table>${
        body.map(r => `<tr>${r.split('\t').map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
      continue;
    }
    html += `<div class="line${ind ? ' bullet' : ''}" style="margin-left:${ind * 1.4}em">${inline(rest)}</div>`;
  }
  return html;
}

/* ===== 画面 ===== */
function renderList() {
  const q = norm($('search').value);
  const list = $('list');
  list.textContent = '';
  for (const n of [...notes].sort((a, b) => b.updated - a.updated)) {
    if (q && !norm(n.text).includes(q)) continue;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = titleOf(n) || '（無題）';
    b.setAttribute('aria-current', String(n === cur));
    b.onclick = () => open(n);
    li.append(b); list.append(li);
  }
}
function refresh() {
  const title = titleOf(cur);
  const body = cur.text.split('\n').slice(1).join('\n').replace(/^\n+/, '');
  $('crumb').textContent = title || '（無題）';
  document.title = `${title || '無題'} - YuzhNote 2.0`;
  $('info').textContent = `${cur.text.length} 文字`;
  const send = $('send');
  send.href = title ? `https://scrapbox.io/${PROJECT}/${encodeURIComponent(title)}?body=${encodeURIComponent(body)}` : '#';
  send.setAttribute('aria-disabled', String(!title));
  // バックリンク：[タイトル] か #タイトル で参照している他のメモ
  const back = !title ? [] : notes.filter(n => n !== cur && (n.text.includes(`[${title}]`) || new RegExp(`(^|\\s)#${title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(\\s|$)`, 'm').test(n.text)));
  $('backlinks').classList.toggle('hidden', !back.length);
  $('backlist').textContent = '';
  back.forEach(n => { const b = document.createElement('button'); b.type = 'button'; b.textContent = titleOf(n); b.onclick = () => open(n); $('backlist').append(b); });
  if (mode === 'view') showView();
}
// 数式は KaTeX で描く。数式があるときだけ読み込む
let katex = null;
function loadKatex() {
  return katex ||= new Promise((ok, ng) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
    const js = document.createElement('script');
    js.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
    js.onload = () => ok(window.katex); js.onerror = () => { katex = null; ng(); };
    document.head.append(css, js);
  });
}
/* ===== 書誌取得ブリッジ（1.3.0 以降）経由でアイコン画像を読む ===== */
// Cosense は他サイトへの画像の埋め込みを断るので、拡張に data: URL にしてもらう
let bridge = null;
const waiters = new Map();
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (d?.type === 'yuzh-bridge-pong') bridge = true;
  if (d?.type === 'yuzh-bridge-res' && waiters.has(d.id)) { waiters.get(d.id)(d); waiters.delete(d.id); }
});
async function hasBridge() {
  if (bridge !== null) return bridge;
  window.postMessage({ type: 'yuzh-bridge-ping' }, location.origin);
  for (let i = 0; i < 15 && bridge === null; i++) await new Promise(r => setTimeout(r, 100));
  return bridge ??= false;
}
function bridgeFetch(url) {
  const id = Math.random().toString(36).slice(2);
  return new Promise(resolve => {
    waiters.set(id, resolve);
    window.postMessage({ type: 'yuzh-bridge-req', id, url }, location.origin);
    setTimeout(() => { if (waiters.delete(id)) resolve({ ok: false }); }, 30000);
  }).then(r => r.ok && r.text.startsWith('data:image/') ? r.text : null);
}
const icons = new Map(); // URL → Promise<data URL | null>
async function loadIcons(view) {
  const spans = view.querySelectorAll('span.icon[data-icon]');
  if (!spans.length || !await hasBridge()) return;
  spans.forEach(el => {
    const src = el.dataset.icon;
    if (!icons.has(src)) icons.set(src, bridgeFetch(src));
    icons.get(src).then(data => {
      if (!data || !el.isConnected) return;
      const img = document.createElement('img');
      Object.assign(img, { className: 'icon', src: data, alt: el.title, title: el.title });
      el.replaceWith(img);
    });
  });
}

function showView() {
  const view = $('view');
  view.innerHTML = render(cur.text);
  const maths = view.querySelectorAll('.math');
  if (maths.length) loadKatex().then(k => maths.forEach(el => k.render(el.dataset.tex, el, { throwOnError: false })), () => {});
  loadIcons(view);
}
function setMode(m) {
  mode = m;
  $('editor').classList.toggle('hidden', m === 'view');
  $('view').classList.toggle('hidden', m === 'edit');
  $('mode').textContent = m === 'edit' ? '閲覧' : '編集';
  if (m === 'view') showView();
  else $('editor').focus();
}

/* ===== 入力 ===== */
let saveTimer;
$('editor').addEventListener('input', () => {
  cur.text = $('editor').value; cur.updated = Date.now();
  clearTimeout(saveTimer); saveTimer = setTimeout(() => { save(); syncToV1(cur); renderList(); }, 300);
  refresh(); suggest();
});

// [ の後に打った文字から、メモと Cosense のページ名を候補に出す
let sugg = [], sel = 0;
function linkQuery() {
  const ed = $('editor');
  const before = ed.value.slice(0, ed.selectionStart);
  const m = before.match(/\[([^\[\]\n]*)$/);
  return m && !/^[*\/$-]\s/.test(m[1]) ? m[1] : null;
}
function suggest() {
  const q = linkQuery();
  const box = $('suggest');
  if (q == null) { box.classList.add('hidden'); sugg = []; return; }
  const nq = norm(q);
  const local = notes.filter(n => n !== cur).map(titleOf).filter(Boolean);
  const all = [...new Set([...local, ...cosense])];
  sugg = all.filter(t => norm(t).includes(nq)).slice(0, 8);
  if (q.trim() && !all.some(t => norm(t) === nq)) sugg.push(q.trim());
  if (!sugg.length) { box.classList.add('hidden'); return; }
  sel = 0;
  box.innerHTML = sugg.map((t, i) => `<li role="option" data-i="${i}">${esc(t)}<small>${local.includes(t) ? 'メモ' : cosense.has(t) ? 'Cosense' : '新規'}</small></li>`).join('');
  markSel();
  // 候補はキャレットのある行の下に出す（textarea 内の正確な位置は取れないので行数から概算）
  const ed = $('editor'), r = ed.getBoundingClientRect();
  const row = ed.value.slice(0, ed.selectionStart).split('\n').length;
  box.style.left = r.left + 'px';
  box.style.top = Math.min(r.top + row * 28 + 4, innerHeight - 250) + 'px';
  box.classList.remove('hidden');
}
function markSel() { [...$('suggest').children].forEach((li, i) => li.setAttribute('aria-selected', String(i === sel))); }
function pick(i) {
  const ed = $('editor'), q = linkQuery();
  const start = ed.selectionStart - q.length;
  const after = ed.value.slice(ed.selectionStart).startsWith(']') ? 1 : 0;
  ed.setRangeText(sugg[i] + ']', start, ed.selectionStart + after, 'end');
  $('suggest').classList.add('hidden'); sugg = [];
  ed.dispatchEvent(new Event('input'));
}
$('suggest').addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
$('editor').addEventListener('keydown', e => {
  if (sugg.length && !$('suggest').classList.contains('hidden')) {
    if (e.key === 'ArrowDown') { sel = (sel + 1) % sugg.length; markSel(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { sel = (sel - 1 + sugg.length) % sugg.length; markSel(); e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { pick(sel); e.preventDefault(); return; }
    if (e.key === 'Escape') { $('suggest').classList.add('hidden'); sugg = []; return; }
  }
  // Tab：行頭なら行のインデント（Cosense の箇条書き）、文字の後ろならタブ文字（表のセル区切り）
  if (e.key === 'Tab' && !e.isComposing) {
    e.preventDefault();
    const ed = e.target, ls = ed.value.lastIndexOf('\n', ed.selectionStart - 1) + 1;
    if (!e.shiftKey && ed.value.slice(ls, ed.selectionStart).trim()) ed.setRangeText('\t', ed.selectionStart, ed.selectionEnd, 'end');
    else if (e.shiftKey) { if (ed.value[ls] === ' ') ed.setRangeText('', ls, ls + 1, 'end'); }
    else ed.setRangeText(' ', ls, ls, 'end');
    ed.dispatchEvent(new Event('input'));
  }
  // Enter で前の行のインデントを引き継ぐ
  if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) {
    const ed = e.target, ls = ed.value.lastIndexOf('\n', ed.selectionStart - 1) + 1;
    const ind = ed.value.slice(ls).match(/^[ \t　]*/)[0];
    if (ind && ls > 0) { e.preventDefault(); ed.setRangeText('\n' + ind, ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
  }
});
$('editor').addEventListener('blur', () => setTimeout(() => $('suggest').classList.add('hidden'), 150));

// 閲覧モードのリンク：メモがあれば開く／Cosense にあればそちらを開く／どちらもなければ新しいメモを作る
$('view').addEventListener('click', e => {
  const a = e.target.closest('a[data-page]');
  if (!a) return;
  e.preventDefault();
  const t = a.dataset.page, local = findByTitle(t);
  if (local) open(local);
  else if (cosense.has(t)) window.open(`https://scrapbox.io/${PROJECT}/${encodeURIComponent(t)}`, '_blank', 'noopener');
  else open(create(t + '\n\n'), 'edit');
});

$('new').onclick = () => open(create(), 'edit');
$('mode').onclick = () => setMode(mode === 'edit' ? 'view' : 'edit');
$('search').oninput = renderList;
$('toggle-side').onclick = () => document.body.classList.toggle('side-open');
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(cur.text); $('info').textContent = 'コピーしました'; }
  catch { $('info').textContent = 'コピーできませんでした'; }
};
$('del').onclick = () => {
  if (cur.text.trim() && !confirm(`「${titleOf(cur) || '無題'}」を削除しますか？`)) return;
  notes = notes.filter(n => n !== cur); cur = null;
  open(notes.sort((a, b) => b.updated - a.updated)[0] || create());
  renderV1();
};
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === 'e') { e.preventDefault(); setMode(mode === 'edit' ? 'view' : 'edit'); }
});

const saved = store.get(KEY);
open(notes.find(n => n.id === saved?.current) || notes[0] || create());
syncFromV1();
renderV1();
</script>
